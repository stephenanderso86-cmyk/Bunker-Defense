<!DOCTYPE html>
<html lang="en">
<head>

<style>

         font: 600 13px/1.35 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
  #hud b { color: #ffe060; }
  #hud .row { margin: 4px 0; }
  #hud .sm { font-size: 11px; font-weight: 500; opacity: .85; margin: 2px 0; }
  .bar { position: relative; height: 15px; border-radius: 8px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.28); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #4cd964; transition: width .12s; }
  .bar em { position: absolute; inset: 0; text-align: center; font-style: normal; font-size: 10px; line-height: 15px; text-shadow: 0 1px 2px #000; }
  #top { position: fixed; top: calc(8px + var(--st)); right: calc(8px + var(--sr)); display: grid; grid-template-columns: repeat(2, 46px); gap: 6px; }
  .mini { width: 46px; height: 36px; border-radius: 10px; border: 1px solid #6b8caf; background: rgba(20,30,50,.82); color: #e8f0ff;
          font: 700 12px system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; padding: 0; }
  .mini.on { border-color: #8dffb0; color: #8dffb0; }
  #abilities { position: fixed; top: calc(142px + var(--st)); right: calc(8px + var(--sr)); width: 98px; display: flex; flex-direction: column; gap: 6px; }
  .abil { height: 42px; border-radius: 10px; border: 1px solid #c58f5a; background: rgba(42,28,18,.86); color: #ffe9cf; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 1px; font-family: system-ui, sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; padding: 0; }
  .abil .t { font-size: 13px; font-weight: 700; }

  .abil:disabled { opacity: .4; cursor: not-allowed; }
  #btns { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--sb)); width: min(96vw, 640px);
          display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  @media (min-width: 560px) { #btns { grid-template-columns: repeat(4, 1fr); } }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; padding: 6px 8px;
         background: rgba(18,26,44,.9); border: 1px solid #6b8caf; border-radius: 10px; color: #e8f0ff; font-family: system-ui, sans-serif;
         touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.45); }

  .towerBtn { min-width: 0; padding: 6px 2px; border: 1px solid #d1a65d; border-radius: 8px; background: rgba(35,32,24,.92); color: #fff1cf;
    font: 700 11px/1.15 system-ui,sans-serif; cursor: pointer; touch-action: manipulation; }

    display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; box-sizing: border-box; border-radius: 12px;

<script>

/* =====================================================================

   Keyboard (desktop): Space = start wave, U = upgrade, D = deploy,
   R = repair, F = speed, P = pause, 1/2/3 = abilities, M = mute
   ===================================================================== */

/* ---------------- CONFIG / DATA TABLES ---------------- */
const MAX_WAVE = 100, MAX_SOLDIERS = 16, MAX_TOWERS = 6, REPAIR_COST = 60, TAU = Math.PI * 2, PIV = -12;

const TARGET_NAMES = { close: 'Closest', first: 'First (bunker)', strong: 'Strongest' };

const PERKS = {

const SOLDIERS = [

  { name: 'Archer',    cost: 80,  hp: 45, dmg: 24, cd: 0.8, range: 210, spd: 54, kind: 'arrow',  pspd: 480,  wk: 'bow',    helm: 2 },
  { name: 'Musketeer', cost: 120, hp: 60, dmg: 55, cd: 1.3, range: 200, spd: 50, kind: 'bullet', pspd: 850,  wk: 'musket', helm: 1 },

  { name: 'Commando',  cost: 250, hp: 95, dmg: 26, cd: 0.2, range: 235, spd: 62, kind: 'bullet', pspd: 1050, wk: 'modern', helm: 3 }
];

  fast:    { hp: 0.6,  sp: 1.8,  r: 7,  dmg: 0.8, gold: 1.2 },

// [type, first wave, share of each wave] — shares stack for unlocked types
const SPAWN_TABLE = [

  ['armored', 6, 0.10], ['brute', 12, 0.08], ['tank', 3, 0.10], ['fast', 2, 0.22]

const COMP_NAME = { normal: 'Grunt', fast: 'Fast', tank: 'Tank', armored: 'Armored', brute: 'Brute', gunner: 'Gunner', flyer: 'Flyer', splitter: 'Splitter', shielded: 'Shielded', healer: 'Healer', boss: 'BOSS' };
const ENEMY_WEAPON = ['club', 'sword', 'musket', 'rifle'];
const EPAL = [

const SPECIAL_PAL = {

  healer:   { body: [70, 165, 100],  dark: [30, 85, 50],  skin: [220, 185, 145], gear: [120, 255, 150] },
  brute:    { body: [145, 45, 45],   dark: [75, 20, 25],  skin: [190, 130, 110], gear: [95, 95, 100] },

  splitter: { body: [175, 145, 50],  dark: [100, 80, 25], skin: [225, 185, 140], gear: [200, 170, 80] },
  shielded: { body: [70, 95, 150],   dark: [35, 50, 90],  skin: [225, 185, 145], gear: [140, 200, 255] }
};
const APAL = { body: [60, 150, 195], dark: [30, 80, 115], skin: [235, 195, 155], gear: [150, 170, 185] };
const FLAG = [[200, 60, 50], [200, 160, 50], [60, 140, 200], [60, 170, 90], [180, 80, 200]];
const TINT = [[1, [0, 0, 0, 0]], [14, [255, 160, 70, 30]], [26, [110, 50, 130, 65]], [38, [10, 20, 70, 110]], [50, [5, 8, 40, 135]]];

/* ---------------- STATE ---------------- */
let bunker, weapon, soldiers, enemies, towers, projectiles, particles, floaters, strikes, eshots;
let selectedTower = null, pickedTower = null, perkOpen = false;
let credits, wave, kills, waveActive, queue, nextQueue, spawnTimer, state, banner;
let perks, abil, rallyT = 0, fxFreeze = 0, autoWave = false, autoT = 0, alarmT = 0;
let speedMul = 1, paused = false, bg = null, decals = null, groundY = 0, shake = 0;
let bestWave = 0, nextId = 1, time = 0, overAt = 0, lastBtnH = 0;
let diffKey = 'normal', daily = false, muted = false, rngState = 1, lastBuzz = 0;

const UI = {
  up: document.getElementById('btnUpgrade'), dep: document.getElementById('btnDeploy'),
  rep: document.getElementById('btnRepair'), start: document.getElementById('btnStart'),
  speed: document.getElementById('btnSpeed'), pause: document.getElementById('btnPause'),
  sound: document.getElementById('btnSound'), auto: document.getElementById('btnAuto'),
  diff: document.getElementById('btnDiff'), daily: document.getElementById('btnDaily'),
  air: document.getElementById('abAir'), freeze: document.getElementById('abFreeze'), rally: document.getElementById('abRally'),
  perks: document.getElementById('btnPerks'),
  tp: document.getElementById('towerPanel'), tpTitle: document.getElementById('tpTitle'),
  tpUp: document.getElementById('tpUp'), tpSell: document.getElementById('tpSell'), tpTgt: document.getElementById('tpTgt'),
  pp: document.getElementById('perkPanel'),
  pk: { dmg: document.getElementById('pkDmg'), rate: document.getElementById('pkRate'), range: document.getElementById('pkRange'), armor: document.getElementById('pkArmor'), train: document.getElementById('pkTrain'), regen: document.getElementById('pkRegen') },
  btns: document.getElementById('btns'), hpFill: document.getElementById('hpFill'), shop: document.getElementById('towerShop')
};
const hudCache = {};

/* ---------------- SMALL HELPERS ---------------- */
function swapRemove(a, i) { a[i] = a[a.length - 1]; a.pop(); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function dailySeed() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function seedRng(s) { rngState = s >>> 0; }
function rng() {                       // seeded in Daily mode, plain random otherwise
  if (!daily) return Math.random();
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function currentDiff() { return DIFFS[daily ? 'normal' : diffKey]; }
function bestKey() { return daily ? 'bd_best_d' + dailySeed() : (diffKey === 'normal' ? 'bd_best' : 'bd_best_' + diffKey); }
function loadBest() { try { bestWave = parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch (e) { bestWave = 0; } }
function saveBest() { try { localStorage.setItem(bestKey(), String(bestWave)); } catch (e) {} }
function savePref(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
function tintFor(w) {
  for (let i = 0; i < TINT.length - 1; i++) {
    const a = TINT[i], b = TINT[i + 1];
    if (w <= b[0]) { const t = constrain((w - a[0]) / (b[0] - a[0]), 0, 1); return a[1].map((v, k) => lerp(v, b[1][k], t)); }
  }
  return TINT[TINT.length - 1][1];
}
function buzz(ms) {
  const n = performance.now();
  if (n - lastBuzz < 220) return;
  lastBuzz = n;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

/* ---------------- AUDIO (WebAudio synth, no files) ---------------- */
let AC = null, noiseBuf = null;
const sfxLast = {};
const SFX_GAP = { bow: 60, shoot: 45, cannon: 90, snipe: 90, frost: 80, hit: 40, die: 55, hurt: 180, alarm: 600 };
function audioInit() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, vol, slide) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noiseB(d, vol, fc) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = fc;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + 0.02);
}
function sfx(n) {
  if (!AC || muted || paused) return;
  const now = performance.now(), gap = SFX_GAP[n] || 0;
  if (gap && sfxLast[n] && now - sfxLast[n] < gap) return;
  sfxLast[n] = now;
  switch (n) {
    case 'bow':    noiseB(0.05, 0.05, 2500); tone(320, 0.08, 'triangle', 0.04, 0.5); break;
    case 'shoot':  tone(520, 0.06, 'square', 0.025, 0.35); noiseB(0.04, 0.03, 3000); break;
    case 'cannon': tone(110, 0.25, 'sawtooth', 0.06, 0.4); noiseB(0.2, 0.08, 700); break;
    case 'snipe':  tone(900, 0.18, 'sawtooth', 0.045, 0.2); noiseB(0.1, 0.05, 4000); break;
    case 'frost':  tone(1200, 0.1, 'sine', 0.03, 0.6); break;
    case 'hit':    tone(240, 0.04, 'triangle', 0.025, 0.7); break;
    case 'die':    noiseB(0.12, 0.05, 1400); break;
    case 'boom':   noiseB(0.55, 0.2, 500); tone(70, 0.4, 'sine', 0.12, 0.4); break;
    case 'hurt':   noiseB(0.1, 0.07, 350); tone(90, 0.1, 'square', 0.04, 0.6); break;
    case 'coin':   tone(880, 0.07, 'sine', 0.04, 1.5); setTimeout(() => tone(1320, 0.09, 'sine', 0.04, 1), 70); break;
    case 'horn':   tone(110, 0.7, 'sawtooth', 0.05, 1.25); tone(165, 0.7, 'sawtooth', 0.03, 1.25); break;
    case 'up':     tone(523, 0.1, 'triangle', 0.05, 1); setTimeout(() => tone(659, 0.1, 'triangle', 0.05, 1), 90); setTimeout(() => tone(784, 0.18, 'triangle', 0.05, 1), 180); break;
    case 'ui':     tone(660, 0.05, 'sine', 0.03, 1); break;
    case 'alarm':  tone(440, 0.12, 'square', 0.03, 0.8); break;
    case 'ice':    noiseB(0.4, 0.07, 5000); tone(1500, 0.35, 'sine', 0.04, 0.3); break;
    case 'warn':   tone(300, 0.2, 'square', 0.03, 1.6); break;
    case 'rally':  tone(392, 0.12, 'triangle', 0.05, 1); setTimeout(() => tone(523, 0.18, 'triangle', 0.05, 1), 110); break;
    case 'no':     tone(160, 0.1, 'square', 0.03, 0.8); break;
  }
}

/* ---------------- P5 LIFECYCLE ---------------- */
function setup() {
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
  createCanvas(windowWidth, windowHeight);
  frameRate(60);
  textFont('system-ui, sans-serif');
  try {
    const d = localStorage.getItem('bd_diff'); if (DIFFS[d]) diffKey = d;
    muted = localStorage.getItem('bd_mute') === '1';
  } catch (e) {}

  UI.up.addEventListener('click', upgradeWeapon);
  UI.dep.addEventListener('click', deploySoldier);
  UI.rep.addEventListener('click', repairBunker);
  UI.start.addEventListener('click', () => { if (state !== 'play') tryRestart(true); else startWave(); });
  UI.speed.addEventListener('click', () => { speedMul = speedMul % 3 + 1; UI.speed.textContent = speedMul + 'x'; });
  UI.pause.addEventListener('click', togglePause);
  UI.sound.addEventListener('click', () => { muted = !muted; savePref('bd_mute', muted ? 1 : 0); audioInit(); sfx('ui'); });
  UI.auto.addEventListener('click', () => { autoWave = !autoWave; autoT = 3; });
  UI.diff.addEventListener('click', () => {
    diffKey = DIFF_ORDER[(DIFF_ORDER.indexOf(diffKey) + 1) % DIFF_ORDER.length]; savePref('bd_diff', diffKey); modeChanged();
  });
  UI.daily.addEventListener('click', () => { daily = !daily; modeChanged(); });
  UI.air.addEventListener('click', airstrike);
  UI.freeze.addEventListener('click', freezeAll);
  UI.rally.addEventListener('click', rallySoldiers);
  UI.perks.addEventListener('click', () => { perkOpen = !perkOpen; if (perkOpen) { pickedTower = null; selectedTower = null; } sfx('ui'); });
  for (const k in UI.pk) UI.pk[k].addEventListener('click', () => buyPerk(k));
  UI.tpUp.addEventListener('click', upgradeTower);
  UI.tpSell.addEventListener('click', sellTower);
  UI.tpTgt.addEventListener('click', () => {
    if (!pickedTower) return;
    pickedTower.mode = TARGET_MODES[(TARGET_MODES.indexOf(pickedTower.mode) + 1) % TARGET_MODES.length]; sfx('ui');
  });
  for (const b of UI.shop.querySelectorAll('[data-tower]')) b.addEventListener('click', () => selectTower(b.dataset.tower));
  window.addEventListener('pointerdown', (e) => { audioInit(); if (e.target && e.target.tagName === 'CANVAS') tryRestart(false); });
  window.addEventListener('keydown', audioInit);

  resetGame();
  updateButtons();
  layout();
}

function modeChanged() {
  if (state === 'play' && wave === 1 && !waveActive) resetGame();
  else { loadBest(); banner = { txt: 'MODE CHANGED', sub: 'Applies next game', t: 0, dur: 1.6 }; }
  sfx('ui');
}

function windowResized() {
  const ow = width, oh = height;
  if (Math.abs(windowWidth - ow) < 2 && Math.abs(windowHeight - oh) < 2) return;
  resizeCanvas(windowWidth, windowHeight);
  const sx = width / ow, sy = height / oh;
  for (const list of [enemies, soldiers, towers, projectiles, particles, floaters, strikes, eshots]) {
    for (const o of list) { o.x *= sx; o.y *= sy; if (o.px !== undefined) { o.px *= sx; o.py *= sy; } }
  }
  layout();
}

function keyPressed() {
  if (key === ' ' || keyCode === ENTER) { UI.start.click(); return false; }
  const k = (key || '').toLowerCase();
  if (k === 'u') UI.up.click();
  else if (k === 'd') UI.dep.click();
  else if (k === 'r') UI.rep.click();
  else if (k === 'f') UI.speed.click();
  else if (k === 'p') togglePause();
  else if (k === 'm') UI.sound.click();
  else if (k === '1') airstrike();
  else if (k === '2') freezeAll();
  else if (k === '3') rallySoldiers();
  else if (keyCode === ESCAPE) { selectedTower = null; pickedTower = null; perkOpen = false; updateTowerShop(); }
}

function togglePause() { if (state === 'play') { paused = !paused; UI.pause.textContent = paused ? '>' : '||'; } }
function tryRestart(force) { if ((state === 'over' || state === 'won') && (force || millis() - overAt > 700)) resetGame(); }

function layout() {
  const h = UI.btns.offsetHeight || 120;
  lastBtnH = h;
  groundY = Math.max(height * 0.55, height - h - 36 - 8);
  if (bunker) { bunker.x = width / 2; bunker.y = groundY - 24; }
  buildBackground();
}

function resetGame() {
  const D = currentDiff();
  if (daily) seedRng(dailySeed());
  weapon = { lv: 0, reload: 0, recoil: 0 };
  bunker = { x: width / 2, y: groundY - 24, hp: 150, maxHp: 150, r: 34, angle: -Math.PI / 2, flash: 0 };
  soldiers = []; enemies = []; towers = []; projectiles = []; particles = []; floaters = []; strikes = []; eshots = [];
  selectedTower = null; pickedTower = null; perkOpen = false;
  perks = { dmg: 0, rate: 0, range: 0, armor: 0, train: 0, regen: 0 };
  abil = { air: { cd: 0 }, freeze: { cd: 0 }, rally: { cd: 0 } };
  rallyT = 0; fxFreeze = 0; alarmT = 0; autoT = 3;
  credits = D.start; wave = 1; kills = 0; waveActive = false; queue = []; spawnTimer = 0;
  state = 'play'; banner = null; shake = 0; paused = false; UI.pause.textContent = '||';
  loadBest();
  nextQueue = buildQueue(1);
  if (decals) decals.clear();
  updateHUD(); updateButtons(); updateTowerShop();
}

/* ---------------- ACTIONS ---------------- */
function upgradeWeapon() {
  const nxt = WEAPONS[weapon.lv + 1];
  if (state !== 'play' || !nxt || credits < nxt.cost) return;
  credits -= nxt.cost; weapon.lv++;
  bunker.maxHp += 50; bunker.hp += 50;
  addP(bunker.x, bunker.y + PIV, 0, 0, 0.6, 30, [255, 230, 130], { add: true, grow: 320, a: 0.45 });
  burst(bunker.x, bunker.y + PIV, 18, [255, 230, 130], 220, 0.7, 4, 0);
  banner = { txt: nxt.name.toUpperCase(), sub: 'Weapon upgraded  (+50 max HP)', t: 0, dur: 1.8 };
  shake = Math.max(shake, 4); sfx('up');
}

function deploySoldier() {
  const def = SOLDIERS[weapon.lv];
  if (state !== 'play' || credits < def.cost || soldiers.length >= MAX_SOLDIERS) return;
  credits -= def.cost;
  const shp = Math.round(def.hp * (1 + 0.1 * perks.train));
  soldiers.push({
    team: 'a', x: bunker.x + random(-20, 20), y: bunker.y + 8, r: 8, hp: shp, maxHp: shp, def: def,
    cd: random(0.3), aim: -Math.PI / 2, phase: 0, hurt: 0, ox: random(-110, 110), oy: random(-85, -35)
  });
  burst(bunker.x, bunker.y + 6, 8, [200, 190, 160], 90, 0.5, 4, 0);
  sfx('ui');
}

function selectTower(type) {
  if (state !== 'play' || !TOWERS[type]) return;
  if (towers.length >= MAX_TOWERS) { floatText(width / 2, height * 0.43, 'TOWER LIMIT (' + MAX_TOWERS + ') - SELL ONE', [255, 160, 90], 14); sfx('no'); return; }
  if (credits < TOWERS[type].cost) { floatText(width / 2, height * 0.43, 'NOT ENOUGH CREDITS', [255, 100, 90], 14); sfx('no'); return; }
  selectedTower = selectedTower === type ? null : type;
  pickedTower = null; perkOpen = false;
  updateTowerShop();
  banner = selectedTower ? { txt: 'PLACE ' + TOWERS[type].name.toUpperCase(), sub: 'Tap an open spot above the bunker', t: 0, dur: 1.5 } : null;
}
function placeSelectedTower(x, y) {
  if (!selectedTower || state !== 'play') return false;
  const D = TOWERS[selectedTower];
  if (credits < D.cost) { selectedTower = null; updateTowerShop(); return true; }
  if (towers.length >= MAX_TOWERS) { selectedTower = null; updateTowerShop(); return true; }
  if (y < 45 || y > groundY - 25 || Math.hypot(x - bunker.x, y - bunker.y) < 68) return true;
  if (towers.some(t => Math.hypot(t.x - x, t.y - y) < 36)) return true;
  credits -= D.cost;
  towers.push({ type: selectedTower, def: D, x, y, r: 13, reload: 0.35, angle: -Math.PI / 2, flash: 0, lv: 0, spent: D.cost, mode: 'close' });
  burst(x, y, 12, D.color, 100, 0.45, 4, 0);
  floatText(x, y - 20, '-' + D.cost, [255, 225, 120], 12);
  selectedTower = null; updateTowerShop(); updateButtons(); sfx('ui');
  return true;
}
function mousePressed(e) {
  if (e && e.target && e.target.tagName !== 'CANVAS') return;     // taps on buttons are handled by the buttons
  if (mouseButton !== LEFT || state !== 'play') return;
  if (selectedTower) { placeSelectedTower(mouseX, mouseY); return false; }
  perkOpen = false;
  let hit = null, bd = 28;
  for (const t of towers) { const d = Math.hypot(t.x - mouseX, t.y - mouseY); if (d < bd) { bd = d; hit = t; } }
  pickedTower = hit === pickedTower ? null : hit;
  if (hit) sfx('ui');
  return false;
}

function tStats(t) {
  const D = t.def, l = t.lv;
  return {
    range: D.range * (1 + 0.05 * l), dmg: D.dmg * (1 + 0.45 * l), cd: D.cd * Math.pow(0.93, l),
    slow: D.slow ? Math.max(0.22, D.slow - 0.05 * l) : 0, splash: D.splash ? D.splash * (1 + 0.08 * l) : 0
  };
}
function towerUpCost(t) { return Math.round(t.def.cost * (0.7 + 0.5 * t.lv)); }
function towerSellValue(t) { return Math.floor(t.spent * SELL_RATE); }
function upgradeTower() {
  const t = pickedTower;
  if (!t || state !== 'play' || t.lv >= TOWER_MAX_LV) return;
  const c = towerUpCost(t);
  if (credits < c) return;
  credits -= c; t.spent += c; t.lv++;
  burst(t.x, t.y, 14, t.def.color, 130, 0.5, 4, 0);
  addP(t.x, t.y, 0, 0, 0.4, 20, [255, 240, 160], { add: true, grow: 60, a: 0.5 });
  floatText(t.x, t.y - 24, 'LV ' + (t.lv + 1), [255, 235, 130], 13); sfx('up');
}
function sellTower() {
  const t = pickedTower;
  if (!t || state !== 'play') return;
  const v = towerSellValue(t);
  credits += v;
  const i = towers.indexOf(t); if (i >= 0) towers.splice(i, 1);
  burst(t.x, t.y, 10, [200, 200, 190], 100, 0.5, 4, 0);
  floatText(t.x, t.y - 22, '+$' + v, [255, 225, 120], 13);
  pickedTower = null; sfx('coin'); updateTowerShop();
}
function updateTowerShop() {
  if (!UI.shop) return;
  const full = towers.length >= MAX_TOWERS;
  for (const b of UI.shop.querySelectorAll('[data-tower]')) {
    const d = TOWERS[b.dataset.tower];
    const sel = selectedTower === b.dataset.tower;
    const dis = state !== 'play' || credits < d.cost || full;
    const html = d.name + '<span>' + (full ? 'FULL' : '$' + d.cost) + '</span>';
    if (b._h !== html) { b.innerHTML = html; b._h = html; }
    if (b._sel !== sel) { b.classList.toggle('selected', sel); b._sel = sel; }
    if (b.disabled !== dis) b.disabled = dis;
  }
}

function perkCost(k) { const l = perks[k]; return Math.round(PERKS[k].base + PERKS[k].step * l * (1 + l / 10)); }
function buyPerk(k) {
  const P = PERKS[k];
  if (state !== 'play' || perks[k] >= P.max || credits < perkCost(k)) return;
  credits -= perkCost(k); perks[k]++;
  if (k === 'armor') { bunker.maxHp += 40; bunker.hp += 40; }
  if (k === 'train') for (const s of soldiers) { const nm = Math.round(s.def.hp * (1 + 0.1 * perks.train)); s.hp += nm - s.maxHp; s.maxHp = nm; }
  burst(bunker.x, bunker.y + PIV, 10, [160, 190, 255], 140, 0.5, 4, 0); sfx('up');
}
function effWeapon() {
  const W = WEAPONS[weapon.lv];
  return { dmg: W.dmg * (1 + 0.12 * perks.dmg), cd: W.cd * Math.pow(0.94, perks.rate), range: W.range * (1 + 0.04 * perks.range) };
}

function repairBunker() {
  if (state !== 'play' || credits < REPAIR_COST || bunker.hp >= bunker.maxHp - 0.5) return;
  credits -= REPAIR_COST;
  bunker.hp = Math.min(bunker.maxHp, bunker.hp + bunker.maxHp * 0.35);
  burst(bunker.x, bunker.y - 10, 12, [120, 255, 150], 120, 0.7, 4, -40);
  floatText(bunker.x, bunker.y - 50, 'REPAIRED', [120, 255, 150], 14); sfx('coin');
}

/* ---- active abilities ---- */
function airstrike() {
  if (state !== 'play' || !waveActive || abil.air.cd > 0 || !enemies.length) return;
  let best = null, bc = -1;
  for (const e of enemies) {
    let c = 0;
    for (const o of enemies) if (Math.hypot(o.x - e.x, o.y - e.y) < 85) c += o.type === 'boss' ? 4 : 1;
    if (c > bc) { bc = c; best = e; }
  }
  abil.air.cd = ABIL_DEF.air.max;
  for (let k = 0; k < 4; k++) {
    const t0 = 0.45 + k * 0.3;
    strikes.push({ x: constrain(best.x + random(-45, 45), 10, width - 10), y: constrain(best.y + random(-35, 35), 10, groundY), t: t0, t0: t0 });
  }
  sfx('warn');
}
function freezeAll() {
  if (state !== 'play' || !waveActive || abil.freeze.cd > 0 || !enemies.length) return;
  abil.freeze.cd = ABIL_DEF.freeze.max;
  for (const e of enemies) {
    e.slowFactor = e.slowTimer > 0 ? Math.min(e.slowFactor, 0.2) : 0.2;
    e.slowTimer = 4;
    burst(e.x, e.y, 4, [170, 235, 255], 80, 0.5, 3, 0);
  }
  fxFreeze = 0.7; sfx('ice');
}
function rallySoldiers() {
  if (state !== 'play' || abil.rally.cd > 0 || !soldiers.length) return;
  abil.rally.cd = ABIL_DEF.rally.max; rallyT = 8;
  for (const s of soldiers) {
    s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.4);
    burst(s.x, s.y, 6, [255, 225, 110], 90, 0.5, 3, -30);
  }
  floatText(bunker.x, bunker.y - 60, 'RALLY!', [255, 225, 110], 15); sfx('rally');
}

/* ---- waves ---- */
function buildQueue(w) {
  const n = 6 + Math.floor(w * 1.1), q = [];
  for (let i = 0; i < n; i++) {
    const r = rng();
    let acc = 0, pick = 'normal';
    for (const row of SPAWN_TABLE) {
      if (w >= row[1]) { acc += row[2]; if (r < acc) { pick = row[0]; break; } }
    }
    q.push(pick);
  }
  if (w % 10 === 0) q.splice(Math.floor(q.length / 2), 0, 'boss');
  return q;
}
function waveInfo() {
  const n = nextQueue ? nextQueue.length : 0;
  return n + ' foes' + (wave % 10 === 0 ? ' - BOSS' : '');
}
function waveCompLines() {
  if (!nextQueue) return [];
  const c = {};
  for (const t of nextQueue) c[t] = (c[t] || 0) + 1;
  const parts = COMP_ORDER.filter(t => c[t]).map(t => c[t] + ' ' + COMP_NAME[t]);
  const lines = [];
  for (let i = 0; i < parts.length; i += 3) lines.push(parts.slice(i, i + 3).join('  -  '));
  return lines;
}
function startWave() {
  if (waveActive || state !== 'play') return;
  waveActive = true; queue = nextQueue.slice(); spawnTimer = 0.7;
  if (decals) decals.clear();
  banner = { txt: 'WAVE ' + wave, sub: wave % 10 === 0 ? 'BOSS INCOMING' : '', t: 0, dur: 2.1 };
  sfx('horn');
  updateButtons();
}

function spawnEnemy(type, o) {
  o = o || {};
  const T = ENEMY_TYPES[type], D = currentDiff();
  const era = wave > 30 ? 3 : (wave > 18 ? 2 : (wave > 7 ? 1 : 0));
  const hs = o.hpScale || 1;
  const ramp = Math.min(1, wave / 25);                  // harder modes ease in over the first 25 waves
  const dHp = D.hp > 1 ? 1 + (D.hp - 1) * ramp : D.hp, dDmg = D.dmg > 1 ? 1 + (D.dmg - 1) * ramp : D.dmg;
  const hp = (45 + wave * 9 + wave * wave * 0.17) * T.hp * dHp * hs;
  let x, y;
  if (o.x !== undefined) { x = o.x; y = o.y; }
  else {
    const side = wave >= 5 ? rng() : 1;
    if (side < 0.13) { x = -24; y = lerp(30, groundY * 0.6, rng()); }
    else if (side < 0.26) { x = width + 24; y = lerp(30, groundY * 0.6, rng()); }
    else { x = lerp(width * 0.08, width * 0.92, rng()); y = -26; }
  }
  enemies.push({
    team: 'e', id: nextId++, type: type, era: era,
    x: x, y: y, hp: hp, maxHp: hp,
    shield: type === 'shielded' ? hp * 0.8 : 0, maxShield: type === 'shielded' ? hp * 0.8 : 1,
    spd: (42 + wave * 0.9) * T.sp, r: T.r * (o.rScale || 1), dmg: (9 + wave * 0.55) * T.dmg * dDmg,
    gold: Math.max(1, Math.round((4 + Math.floor(wave * 0.3)) * T.gold * D.gold * (o.hpScale ? Math.max(0.3, o.hpScale) : 1))),
    phase: random(TAU), seed: random(100), vx: 0, vy: 0, flash: 0, aim: Math.PI / 2, healCd: random(0.5, 1.5),
    slowTimer: 0, slowFactor: 1, range: 165, cd: random(0.5, 1.5), sumCd: 4
  });
}

/* ---------------- FX HELPERS ---------------- */
function addP(x, y, vx, vy, life, size, col, o) {
  if (particles.length > 520) return;
  const p = { x: x, y: y, vx: vx, vy: vy, life: life, max: life, size: size, col: col, g: 0, drag: 0, grow: 0, add: false, a: 1 };
  if (o) Object.assign(p, o);
  particles.push(p);
}
function burst(x, y, n, col, spd, life, size, g) {
  for (let i = 0; i < n; i++) {
    const a = random(TAU), s = random(spd * 0.3, spd);
    addP(x, y, Math.cos(a) * s, Math.sin(a) * s, random(life * 0.6, life), random(size * 0.6, size), col, { g: g, drag: 2 });
  }
}
function floatText(x, y, txt, col, size) {
  if (floaters.length > 60) return;
  floaters.push({ x: x, y: y, txt: String(txt), col: col, size: size || 12, life: 0.9, max: 0.9 });
}
function hitBunker(dmg) {
  bunker.hp -= dmg; bunker.flash = 0.4;
  sfx('hurt'); buzz(14);
}
function damageEnemy(e, dmg, breaker) {
  if (e.type === 'armored') dmg *= 0.62;
  if (e.shield > 0) {
    const m = breaker ? 2 : 0.5, sd = dmg * m;
    if (sd >= e.shield) {
      const over = (sd - e.shield) / m;
      e.shield = 0; e.hp -= over;
      burst(e.x, e.y, 10, [130, 210, 255], 150, 0.4, 3, 0);
    } else e.shield -= sd;
  } else e.hp -= dmg;
  e.flash = 1;
}

/* ---------------- SIMULATION ---------------- */
function update(dt) {
  shake = Math.max(0, shake - dt * 20);
  bunker.flash = Math.max(0, bunker.flash - dt * 2.5);
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  for (const k in abil) abil[k].cd = Math.max(0, abil[k].cd - dt);
  rallyT = Math.max(0, rallyT - dt); fxFreeze = Math.max(0, fxFreeze - dt);
  if (waveActive && perks.regen) bunker.hp = Math.min(bunker.maxHp, bunker.hp + bunker.maxHp * 0.0025 * perks.regen * dt);

  if (!waveActive && autoWave) { autoT -= dt; if (autoT <= 0) startWave(); }

  if (waveActive && queue.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy(queue.shift());
      spawnTimer = Math.max(0.12, 0.68 - wave * 0.006) * random(0.6, 1.25);
    }
  }

  updateEnemies(dt);
  updateSoldiers(dt);
  updateTurret(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateEShots(dt);
  updateStrikes(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { swapRemove(particles, i); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 28 * dt;
    if (f.life <= 0) swapRemove(floaters, i);
  }

  const hpPct = bunker.hp / bunker.maxHp;
  if (hpPct < 0.5 && Math.random() < dt * 6) addP(bunker.x + random(-25, 25), bunker.y - 6, random(-8, 8), -40, 1.1, 6, [75, 75, 75], { grow: 14, a: 0.5 });
  if (hpPct < 0.25 && Math.random() < dt * 8) addP(bunker.x + random(-25, 25), bunker.y - 8, random(-20, 20), -60, 0.5, 5, [255, 150, 50], { add: true, a: 0.8 });
  if (hpPct < 0.25 && waveActive) { alarmT -= dt; if (alarmT <= 0) { alarmT = 1.1; sfx('alarm'); } }

  if (waveActive && queue.length === 0 && enemies.length === 0) {
    waveActive = false;
    const bonus = 25 + wave * 4;
    credits += bonus;
    bunker.hp = Math.min(bunker.maxHp, bunker.hp + bunker.maxHp * (wave <= 15 ? 0.15 : 0.08));
    banner = { txt: 'WAVE ' + wave + ' CLEARED', sub: '+$' + bonus + '  -  ' + kills + ' kills', t: 0, dur: 2 };
    bestWave = Math.max(bestWave, wave); saveBest();
    wave++; autoT = 4; sfx('coin');
    if (wave > MAX_WAVE) { state = 'won'; overAt = millis(); }
    else nextQueue = buildQueue(wave);
  }
  if (bunker.hp <= 0) {
    bunker.hp = 0; state = 'over'; overAt = millis();
    bestWave = Math.max(bestWave, wave - 1); saveBest();
    burst(bunker.x, bunker.y, 40, [255, 170, 60], 300, 1, 7, 100);
    shake = 14; sfx('boom'); buzz(80);
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) { killEnemy(e); swapRemove(enemies, i); continue; }
    e.flash = Math.max(0, e.flash - dt * 5);
    e.slowTimer = Math.max(0, (e.slowTimer || 0) - dt);
    if (e.slowTimer <= 0) e.slowFactor = 1;
    if (e.type === 'healer') {
      e.healCd -= dt;
      if (e.healCd <= 0) { e.healCd = 1.4; for (const ally of enemies) if (ally !== e && ally.hp > 0 && Math.hypot(ally.x - e.x, ally.y - e.y) < 78) { ally.hp = Math.min(ally.maxHp, ally.hp + ally.maxHp * 0.055); addP(ally.x, ally.y, 0, -18, 0.25, 5, [90, 255, 130], { add: true }); } }
    }
    if (e.type === 'boss' && waveActive) {
      e.sumCd -= dt;
      if (e.sumCd <= 0) {
        e.sumCd = 6.5;
        for (let k = 0; k < 2; k++) spawnEnemy('normal', { x: e.x + random(-34, 34), y: e.y + 10, hpScale: 0.5, rScale: 0.9 });
        burst(e.x, e.y, 10, [200, 60, 60], 120, 0.5, 4, 0);
      }
    }

    const flyer = e.type === 'flyer';
    const bx = bunker.x, by = bunker.y - 8;
    const bd = Math.hypot(bx - e.x, by - e.y) || 1;

    // nearest soldier (flyers ignore soldiers)
    let tgt = null, td = 1e9;
    if (!flyer) for (const s of soldiers) { const d = Math.hypot(s.x - e.x, s.y - e.y); if (d < td) { td = d; tgt = s; } }

    // go for a soldier whenever one is closer than the bunker
    let tx = bx, ty = by, soldierTarget = null;
    if (tgt && td < bd) { tx = tgt.x; ty = tgt.y; soldierTarget = tgt; }
    const dist = soldierTarget ? td : bd;

    let engaged = false;
    if (e.type === 'gunner') {
      if (dist <= e.range) {
        engaged = true; e.cd -= dt;
        if (e.cd <= 0) { e.cd = 1.5; enemyShoot(e, tx, ty); }
      }
    } else if (soldierTarget) {
      if (td <= e.r + tgt.r + 3) {
        engaged = true; tgt.hp -= e.dmg * dt; tgt.hurt = 0.2;
        if (Math.random() < dt * 8) addP(tgt.x, tgt.y, random(-30, 30), random(-40, -10), 0.4, 3, [200, 60, 50], { g: 120 });
      }
    } else if (bd <= bunker.r + e.r * 0.4) {
      engaged = true; hitBunker(e.dmg * dt);
      shake = Math.max(shake, e.type === 'boss' ? 6 : 2.2);
      if (Math.random() < dt * 6) addP(e.x, e.y + e.r, random(-20, 20), random(-40, -10), 0.5, 4, [150, 130, 100], { grow: 6, a: 0.7 });
    }
    if (engaged) { e.vx = 0; e.vy = 0; e.phase += dt * 6; }
    else {
      const a = Math.atan2(ty - e.y, tx - e.x) + Math.sin(time * 1.6 + e.seed) * (flyer ? 0.08 : 0.2);
      const slow = e.slowTimer > 0 ? (e.slowFactor || 0.5) : 1;
      e.vx = Math.cos(a) * e.spd * slow; e.vy = Math.sin(a) * e.spd * slow;
      e.x += e.vx * dt; e.y += e.vy * dt; e.phase += dt * e.spd * 0.22;
    }
    e.aim = Math.atan2(ty - e.y, tx - e.x);
  }
}

function enemyShoot(e, tx, ty) {
  const a = Math.atan2(ty - e.y, tx - e.x);
  const mx = e.x + Math.cos(a) * 12, my = e.y - 3 + Math.sin(a) * 12;
  eshots.push({ x: mx, y: my, vx: Math.cos(a) * 270, vy: Math.sin(a) * 270, dmg: e.dmg * 1.4, life: 1.8 });
  addP(mx, my, 0, 0, 0.08, 12, [255, 150, 90], { add: true });
  sfx('shoot');
}
function updateEShots(dt) {
  for (let i = eshots.length - 1; i >= 0; i--) {
    const s = eshots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    let gone = s.life <= 0 || s.x < -30 || s.x > width + 30 || s.y < -40 || s.y > height + 30;
    if (!gone) {
      for (const so of soldiers) {
        if (Math.hypot(so.x - s.x, so.y - s.y) < so.r + 3) {
          so.hp -= s.dmg; so.hurt = 0.2; gone = true;
          burst(s.x, s.y, 4, [210, 70, 60], 90, 0.3, 3, 0); break;
        }
      }
    }
    if (!gone && Math.hypot(bunker.x - s.x, bunker.y - 6 - s.y) < bunker.r) {
      hitBunker(s.dmg); gone = true; shake = Math.max(shake, 2.5);
      burst(s.x, s.y, 5, [255, 170, 80], 100, 0.3, 3, 0);
    }
    if (gone) swapRemove(eshots, i);
  }
}
function updateStrikes(dt) {
  for (let i = strikes.length - 1; i >= 0; i--) {
    const s = strikes[i];
    s.t -= dt;
    if (s.t > 0) continue;
    const R = 78, dmg = 220 + wave * 10;
    for (const e of enemies) if (e.hp > 0 && Math.hypot(e.x - s.x, e.y - s.y) < R + e.r * 0.5) damageEnemy(e, dmg, true);
    burst(s.x, s.y, 22, [255, 170, 60], 260, 0.6, 6, 40);
    burst(s.x, s.y, 12, [90, 80, 70], 120, 0.9, 7, -10);
    addP(s.x, s.y, 0, 0, 0.45, R * 0.8, [255, 220, 150], { add: true, grow: R * 1.2, a: 0.7 });
    if (decals) { decals.noStroke(); decals.fill(20, 15, 10, 120); decals.ellipse(s.x, s.y + 4, 70 + random(20), 34 + random(10)); }
    shake = Math.max(shake, 8); sfx('boom'); buzz(25);
    swapRemove(strikes, i);
  }
}

function killEnemy(e) {
  kills++; credits += e.gold;
  const big = e.type === 'tank' || e.type === 'boss' || e.type === 'brute';
  burst(e.x, e.y, big ? 18 : 9, [190, 150, 110], 150, 0.6, e.r * 0.5, 60);
  burst(e.x, e.y, big ? 12 : 5, [170, 50, 45], 120, 0.5, e.r * 0.4, 120);
  addP(e.x, e.y, 0, 0, 0.35, e.r * 3, [255, 220, 150], { add: true, grow: e.r * 6, a: 0.6 });
  if (e.type === 'healer') burst(e.x, e.y, 10, [90, 255, 130], 140, 0.6, 4, 0);
  if (e.type === 'armored') burst(e.x, e.y, 8, [200, 210, 220], 170, 0.5, 3, 60);
  if (decals) {
    decals.noStroke(); decals.fill(55, 25, 20, 90);
    decals.ellipse(e.x, e.y + e.r * 0.5, e.r * 2.6 + random(8), e.r * 1.2 + random(4));
  }
  floatText(e.x, e.y - e.r - 6, '+' + e.gold, [255, 224, 96], big ? 14 : 11);
  if (big) shake = Math.max(shake, e.type === 'boss' ? 10 : 5);
  if (e.type === 'splitter') {
    for (let k = 0; k < 2; k++) spawnEnemy('normal', { x: e.x + (k ? 12 : -12), y: e.y, hpScale: 0.35, rScale: 0.75 });
    burst(e.x, e.y, 8, [220, 190, 80], 130, 0.4, 3, 0);
  }
  sfx('die');
  if (e.type === 'boss') { banner = { txt: 'BOSS DEFEATED', sub: '+$' + e.gold, t: 0, dur: 2 }; buzz(40); sfx('boom'); }
}

function shoot(x, y, tx, ty, speed, dmg, kind, pierce, range, crit, breaker) {
  const a = Math.atan2(ty - y, tx - x);
  projectiles.push({ x: x, y: y, px: x, py: y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, dmg: dmg, kind: kind, pierce: pierce, hit: [], ang: a, life: range * 1.1 / speed, crit: crit, breaker: !!breaker });
  return a;
}

function updateSoldiers(dt) {
  const LEASH = Math.max(260, Math.min(width, height) * 0.55);
  for (let i = soldiers.length - 1; i >= 0; i--) {
    const s = soldiers[i];
    if (s.hp <= 0) {
      burst(s.x, s.y, 10, [80, 170, 210], 120, 0.6, 3, 0);
      if (decals) { decals.noStroke(); decals.fill(30, 55, 70, 90); decals.ellipse(s.x, s.y + 5, 18, 8); }
      swapRemove(soldiers, i); continue;
    }
    const D = s.def, melee = D.kind === 'melee';
    s.hurt = Math.max(0, s.hurt - dt); s.cd -= dt;
    let t = null, bd = 1e9;
    for (const e of enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - bunker.x, e.y - bunker.y) > LEASH) continue;
      if (melee && e.type === 'flyer') continue;
      const d = Math.hypot(e.x - s.x, e.y - s.y);
      if (d < bd) { bd = d; t = e; }
    }
    let mx = 0, my = 0;
    if (t) {
      const a = Math.atan2(t.y - s.y, t.x - s.x); s.aim = a;
      const want = melee ? s.r + t.r + 3 : D.range * 0.8;
      if (bd > want) { mx = Math.cos(a); my = Math.sin(a); }
      const reach = melee ? s.r + t.r + 9 : D.range;
      if (bd <= reach && s.cd <= 0) { s.cd = D.cd; soldierAttack(s, t, bd); }
    } else {
      const hx = bunker.x + s.ox, hy = bunker.y + s.oy, d = Math.hypot(hx - s.x, hy - s.y);
      if (d > 4) { mx = (hx - s.x) / d; my = (hy - s.y) / d; }
      s.aim += angDiff(s.aim, -Math.PI / 2) * Math.min(1, dt * 4);
    }
    for (const o of soldiers) {
      if (o === s) continue;
      const dx = s.x - o.x, dy = s.y - o.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 14) { mx += dx / d * 0.8; my += dy / d * 0.8; }
    }
    const ml = Math.hypot(mx, my);
    if (ml > 0.01) {
      const k = D.spd * dt / Math.max(1, ml);
      s.x += mx * k; s.y += my * k; s.phase += dt * D.spd * 0.22;
    }
    s.x = constrain(s.x, 8, width - 8); s.y = constrain(s.y, 24, groundY + 8);
  }
}

function soldierAttack(s, t, d) {
  const D = s.def, dmg = D.dmg * (1 + 0.1 * perks.train) * (rallyT > 0 ? 1.6 : 1);
  if (D.kind === 'melee') {
    damageEnemy(t, dmg, false);
    burst(t.x, t.y, 4, [255, 240, 140], 120, 0.3, 3, 0);
    if (Math.random() < 0.6) floatText(t.x + random(-6, 6), t.y - t.r - 10, Math.round(dmg), [255, 255, 255], 11);
    sfx('hit');
  } else {
    const lead = d / D.pspd;
    const px = s.x + Math.cos(s.aim) * 10, py = s.y - 2 + Math.sin(s.aim) * 10;
    shoot(px, py, t.x + t.vx * lead, t.y + t.vy * lead, D.pspd, dmg, D.kind, 0, D.range, false, false);
    if (D.kind === 'bullet') addP(px + Math.cos(s.aim) * 8, py + Math.sin(s.aim) * 8, 0, 0, 0.07, 10, [255, 220, 120], { add: true });
    sfx(D.kind === 'arrow' ? 'bow' : 'shoot');
  }
}

function pickTarget(E) {
  const px = bunker.x, py = bunker.y + PIV;
  let t = null, b = 1e9;
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const d = Math.hypot(e.x - px, e.y - py);
    if (d < E.range && d < b) { b = d; t = e; }
  }
  return t;
}

function updateTurret(dt) {
  const W = WEAPONS[weapon.lv], E = effWeapon(), px = bunker.x, py = bunker.y + PIV;
  weapon.reload -= dt; weapon.recoil = Math.max(0, weapon.recoil - dt * 6);
  const t = waveActive ? pickTarget(E) : null;
  if (t) bunker.angle += angDiff(bunker.angle, Math.atan2(t.y - py, t.x - px)) * Math.min(1, dt * 12);
  else bunker.angle += angDiff(bunker.angle, -Math.PI / 2) * Math.min(1, dt * 3);
  if (!t || weapon.reload > 0) return;

  weapon.reload = E.cd;
  const d = Math.hypot(t.x - px, t.y - py), tt = d / W.speed;
  const tx = t.x + t.vx * tt, ty = t.y + t.vy * tt;
  const a = Math.atan2(ty - py, tx - px);
  bunker.angle = a; weapon.recoil = 1;
  const mx = px + Math.cos(a) * W.muzzle, my = py + Math.sin(a) * W.muzzle;
  const crit = Math.random() < 0.08;
  shoot(mx, my, tx, ty, W.speed, E.dmg * (crit ? 1.8 : 1), W.kind, W.pierce, E.range, crit, E.dmg >= 100);
  sfx(W.kind === 'arrow' ? 'bow' : 'shoot');
  if (W.kind === 'bullet') {
    addP(mx, my, 0, 0, 0.09, 24, [255, 225, 130], { add: true, a: 0.9 });
    burst(mx, my, 3, [255, 210, 110], 140, 0.18, 2, 0);
    addP(px, py - 4, random(-40, -15), random(-70, -40), 0.6, 2.5, [220, 180, 80], { g: 300 });
  }
}

function updateTowers(dt) {
  for (const t of towers) {
    const st = tStats(t);
    t.reload -= dt; t.flash = Math.max(0, t.flash - dt * 4);
    let target = null, best = Infinity;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      const d = Math.hypot(e.x - t.x, e.y - t.y);
      if (d > st.range) continue;
      const score = t.mode === 'close' ? d : (t.mode === 'first' ? Math.hypot(e.x - bunker.x, e.y - bunker.y) : -(e.hp + e.shield));
      if (score < best) { best = score; target = e; }
    }
    if (!target) { t.angle += angDiff(t.angle, -Math.PI / 2) * Math.min(1, dt * 2); continue; }
    const dist = Math.hypot(target.x - t.x, target.y - t.y), lead = dist / t.def.speed;
    const ax = target.x + target.vx * lead, ay = target.y + target.vy * lead;
    t.angle += angDiff(t.angle, Math.atan2(ay - t.y, ax - t.x)) * Math.min(1, dt * 10);
    if (t.reload > 0) continue;
    t.reload = st.cd; t.flash = 1; t.angle = Math.atan2(ay - t.y, ax - t.x);
    const px = t.x + Math.cos(t.angle) * 10, py = t.y - 7 + Math.sin(t.angle) * 10;
    projectiles.push({
      x: px, y: py, px, py, vx: Math.cos(t.angle) * t.def.speed, vy: Math.sin(t.angle) * t.def.speed,
      dmg: st.dmg, kind: t.def.kind, pierce: t.def.pierce || 0, hit: [], ang: t.angle, life: st.range * 1.2 / t.def.speed, crit: false,
      splash: st.splash, slow: st.slow, breaker: !!t.def.breaker
    });
    if (t.def.kind === 'shell') { burst(px, py, 4, t.def.color, 55, 0.2, 3, 0); sfx('cannon'); }
    else if (t.type === 'sniper') sfx('snipe');
    else if (t.def.kind === 'frost') sfx('frost');
    else sfx('shoot');
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.px = p.x; p.py = p.y; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.kind === 'shell' && Math.random() < dt * 40) addP(p.x, p.y, random(-10, 10), random(-10, 10), 0.35, 5, [120, 115, 110], { grow: 6, a: 0.5 });
    if (p.kind === 'frost' && Math.random() < dt * 40) addP(p.x, p.y, random(-12, 12), random(-12, 12), 0.3, 3, [170, 235, 255], { add: true, a: 0.7 });
    for (const e of enemies) {
      if (e.hp <= 0 || p.hit.indexOf(e.id) >= 0) continue;
      if (segDist(e.x, e.y, p.px, p.py, p.x, p.y) < e.r + 3) {
        p.hit.push(e.id);
        damageEnemy(e, p.dmg, p.breaker);
        if (p.kind === 'frost') {
          const f = p.slow || 0.48;
          e.slowFactor = e.slowTimer > 0 ? Math.min(e.slowFactor, f) : f;
          e.slowTimer = Math.max(e.slowTimer, 1.8);
          burst(e.x, e.y, 4, [170, 235, 255], 80, 0.4, 3, 0);
        }
        if (p.splash) {
          for (const near of enemies) {
            if (near !== e && near.hp > 0 && Math.hypot(near.x - e.x, near.y - e.y) <= p.splash) damageEnemy(near, p.dmg * 0.65, p.breaker);
          }
          addP(e.x, e.y, 0, 0, 0.3, 14, [255, 190, 100], { add: true, grow: p.splash * 1.6, a: 0.6 });
          burst(e.x, e.y, 8, [255, 170, 70], 140, 0.4, 4, 0);
        }
        burst(e.x, e.y, p.crit ? 7 : 4, p.crit ? [255, 160, 70] : [255, 240, 140], 150, 0.3, 3, 0);
        if (p.crit || Math.random() < 0.5) floatText(e.x + random(-6, 6), e.y - e.r - 10, Math.round(p.dmg), p.crit ? [255, 150, 60] : [255, 255, 255], p.crit ? 15 : 11);
        sfx('hit');
        if (p.pierce-- <= 0) { p.life = 0; break; }
      }
    }
    if (p.life <= 0 || p.x < -30 || p.x > width + 30 || p.y < -40 || p.y > height + 30) swapRemove(projectiles, i);
  }
}

/* ---------------- BACKGROUND (pre-rendered) ---------------- */
function drawTree(g, x, y, s) {
  g.noStroke(); g.fill(0, 0, 0, 60); g.ellipse(x, y + s * 0.55, s * 1.5, s * 0.5);
  g.fill(70, 48, 30); g.rect(x - s * 0.08, y - s * 0.1, s * 0.16, s * 0.6);
  const cols = [[28, 70, 32], [36, 88, 38], [48, 108, 46]];
  g.fill(cols[0][0], cols[0][1], cols[0][2]); g.ellipse(x, y - s * 0.2, s * 1.1, s * 0.95);
  g.fill(cols[1][0], cols[1][1], cols[1][2]); g.ellipse(x - s * 0.12, y - s * 0.32, s * 0.8, s * 0.7);
  g.fill(cols[2][0], cols[2][1], cols[2][2]); g.ellipse(x - s * 0.2, y - s * 0.42, s * 0.42, s * 0.36);
}

function buildBackground() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if (bg) bg.remove();
  if (decals) decals.remove();
  bg = createGraphics(width, height); bg.pixelDensity(d);
  decals = createGraphics(width, height); decals.pixelDensity(d);
  const g = bg;
  g.noStroke(); g.background(46, 80, 38);
  noiseSeed(7);

  for (let y = -10; y < groundY + 24; y += 14) {
    for (let x = -10; x < width + 10; x += 14) {
      const n = noise(x * 0.011, y * 0.011), m = noise(x * 0.05 + 50, y * 0.05 + 50);
      g.fill(lerp(34, 66, n) + m * 8, lerp(62, 108, n) + m * 10, lerp(28, 46, n), 200);
      g.ellipse(x + random(-3, 3), y + random(-3, 3), random(20, 28), random(16, 22));
    }
  }
  g.strokeWeight(1.3);
  const nT = Math.floor(width * groundY / 260);
  for (let i = 0; i < nT; i++) {
    const x = random(width), y = random(groundY + 10), h = random(3, 7);
    g.stroke(random(40, 90), random(80, 140), 40, 160);
    g.line(x, y, x + random(-2, 2), y - h);
  }
  g.noStroke();

  // dirt apron around the bunker
  const rx = Math.min(width * 0.4, 280);
  for (let i = 0; i < 380; i++) {
    const a = random(TAU), rr = Math.sqrt(random());
    const x = width / 2 + Math.cos(a) * rr * rx, y = Math.min(groundY + 18, groundY - 14 + Math.sin(a) * rr * 78);
    g.fill(random(105, 130), random(82, 102), random(55, 70), random(60, 120));
    g.ellipse(x, y, random(10, 26), random(6, 14));
  }
  // craters
  for (let i = 0; i < 4; i++) {
    const x = random(width * 0.1, width * 0.9), y = random(groundY * 0.2, groundY - 110), w = random(30, 55);
    g.fill(95, 80, 55, 150); g.ellipse(x, y, w * 1.15, w * 0.62);
    g.fill(30, 40, 24, 170); g.ellipse(x, y + 1, w * 0.85, w * 0.42);
  }
  // rocks
  for (let i = 0; i < 12; i++) {
    const x = random(width), y = random(30, groundY - 70), s = random(8, 18);
    if (Math.abs(x - width / 2) < 60 && y > groundY - 120) continue;
    g.fill(0, 0, 0, 55); g.ellipse(x, y + s * 0.35, s * 1.6, s * 0.5);
    g.fill(112, 114, 112); g.ellipse(x, y, s * 1.5, s);
    g.fill(150, 152, 148); g.ellipse(x - s * 0.2, y - s * 0.2, s * 0.7, s * 0.4);
  }
  // flowers
  for (let i = 0; i < 90; i++) {
    const c = random([[255, 230, 90], [250, 250, 250], [240, 130, 170], [150, 170, 255]]);
    g.fill(c[0], c[1], c[2], 200); g.ellipse(random(width), random(groundY), 3, 3);
  }
  // trees and bushes: edges mostly
  for (let i = 0; i < 9; i++) {
    const left = i % 2 === 0;
    const x = left ? random(-10, width * 0.11) : random(width * 0.89, width + 10);
    drawTree(g, x, random(30, groundY - 90), random(40, 72));
  }
  for (let i = 0; i < 4; i++) drawTree(g, random(width * 0.15, width * 0.85), random(40, groundY - 150), random(22, 34));

  // earth strip under the bunker (sits behind the UI buttons)
  const ctx = g.drawingContext;
  const gr = ctx.createLinearGradient(0, groundY + 10, 0, height);
  gr.addColorStop(0, 'rgb(92,66,42)'); gr.addColorStop(1, 'rgb(44,32,24)');
  ctx.fillStyle = gr; ctx.fillRect(0, groundY + 10, width, height - groundY - 10);
  g.stroke(28, 48, 22); g.strokeWeight(5); g.line(0, groundY + 10, width, groundY + 10);
  g.noStroke();
  for (let i = 0; i < 70; i++) {
    g.fill(random(70, 120), random(60, 100), random(50, 80), 150);
    g.ellipse(random(width), random(groundY + 16, height), random(4, 11), random(3, 7));
  }
}

/* ---------------- RENDERING ---------------- */
function render() {
  rectMode(CORNER); textAlign(CENTER, CENTER); strokeCap(ROUND);
  push();
  if (shake > 0) translate(random(-shake, shake), random(-shake, shake));
  background(20, 30, 20);
  image(bg, 0, 0, width, height);
  image(decals, 0, 0, width, height);
  drawRange();
  drawStrikeMarkers();

  const ents = enemies.concat(soldiers);
  ents.sort((a, b) => a.y - b.y);
  for (const o of ents) { if (o.team === 'e') drawEnemy(o); else drawSoldier(o); }
  for (const t of towers) drawTower(t);
  if (pickedTower) drawPickedRing(pickedTower);
  drawBunker();
  if (selectedTower) drawPlacementGhost(mouseX, mouseY);

  for (const p of projectiles) drawProjectile(p);
  for (const s of eshots) drawEShot(s);
  drawParticles(false);
  blendMode(ADD); drawParticles(true); blendMode(BLEND);
  for (const f of floaters) {
    const k = f.life / f.max;
    textSize(f.size); textStyle(BOLD);
    fill(0, 0, 0, 160 * k); text(f.txt, f.x + 1, f.y + 1);
    fill(f.col[0], f.col[1], f.col[2], 255 * Math.min(1, k * 1.6)); text(f.txt, f.x, f.y);
  }
  textStyle(NORMAL);
  pop();

  // ambient light for the wave progression, then vignette
  const tn = tintFor(Math.min(wave, MAX_WAVE));
  if (tn[3] > 0) { noStroke(); fill(tn[0], tn[1], tn[2], tn[3]); rect(0, 0, width, height); }
  if (tn[3] > 55) {
    blendMode(ADD); noStroke();
    for (let i = 3; i >= 1; i--) { fill(255, 170, 70, tn[3] * 0.16); ellipse(bunker.x, bunker.y - 6, 90 * i, 60 * i); }
    blendMode(BLEND);
  }
  if (fxFreeze > 0) { noStroke(); fill(150, 225, 255, 70 * (fxFreeze / 0.7)); rect(0, 0, width, height); }
  drawVignette(0, 0, 0, 0.42);
  const hpPct = bunker.hp / bunker.maxHp;
  const danger = Math.max(bunker.flash * 0.5, hpPct < 0.3 ? (0.25 + 0.15 * Math.sin(time * 6)) * (1 - hpPct / 0.3 * 0.5) : 0);
  if (danger > 0.02) drawVignette(255, 20, 20, Math.min(0.7, danger));

  if (state === 'play' && !waveActive && !banner) {
    textSize(13); fill(255, 255, 255, 170);
    text(wave === 1 ? 'Buy towers, tap the field to place, tap a tower to upgrade it, then START WAVE' : 'Spend credits on towers, perks and soldiers, then START WAVE', width / 2, 120);
    textSize(12); fill(255, 224, 140, 190);
    const lines = waveCompLines();
    for (let i = 0; i < lines.length; i++) text((i === 0 ? 'Incoming: ' : '') + lines[i], width / 2, 140 + i * 16);
    if (autoWave) { fill(140, 255, 170, 200); text('Auto-start in ' + Math.max(0, Math.ceil(autoT)), width / 2, 144 + lines.length * 16); }
  }
  if (banner) drawBanner();
  if (paused) {
    noStroke(); fill(0, 0, 0, 120); rect(0, 0, width, height);
    textStyle(BOLD); textSize(32); fill(255); text('PAUSED', width / 2, height / 2); textStyle(NORMAL);
  }
  if (state !== 'play') drawEndOverlay();
}

function drawVignette(r, g, b, a) {
  const ctx = drawingContext, m = Math.min(width, height), M = Math.max(width, height);
  const gr = ctx.createRadialGradient(width / 2, height / 2, m * 0.35, width / 2, height / 2, M * 0.75);
  gr.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, width, height);
}

function drawRange() {
  const E = effWeapon();
  drawingContext.setLineDash([8, 10]);
  noFill(); stroke(255, 255, 255, waveActive ? 22 : 60); strokeWeight(2);
  ellipse(bunker.x, bunker.y + PIV, E.range * 2, E.range * 2);
  drawingContext.setLineDash([]);
  noStroke();
}

function drawStrikeMarkers() {
  for (const s of strikes) {
    const k = 1 - Math.max(0, s.t) / s.t0;
    noFill(); stroke(255, 70, 50, 130 + 80 * Math.sin(time * 20)); strokeWeight(2);
    ellipse(s.x, s.y, 156, 156);
    stroke(255, 200, 90, 170); ellipse(s.x, s.y, 156 * (1 - k), 156 * (1 - k));
    noStroke();
  }
}

function drawParticles(add) {
  noStroke();
  for (const p of particles) {
    if (p.add !== add) continue;
    const k = p.life / p.max, s = p.size + p.grow * (1 - k);
    fill(p.col[0], p.col[1], p.col[2], 255 * k * p.a);
    ellipse(p.x, p.y, s, s);
  }
}

function drawEShot(s) {
  stroke(255, 120, 70, 130); strokeWeight(5); line(s.x - s.vx * 0.03, s.y - s.vy * 0.03, s.x, s.y);
  stroke(255, 230, 190); strokeWeight(2.5); line(s.x - s.vx * 0.012, s.y - s.vy * 0.012, s.x, s.y);
  noStroke();
}

function drawProjectile(p) {
  if (p.kind === 'arrow') {
    stroke(235, 210, 150); strokeWeight(2.5);
    const bx = p.x - Math.cos(p.ang) * 14, by = p.y - Math.sin(p.ang) * 14;
    line(bx, by, p.x, p.y);
    noStroke(); fill(220, 225, 235);
    const ca = Math.cos(p.ang), sa = Math.sin(p.ang);
    triangle(p.x + ca * 5, p.y + sa * 5, p.x - ca * 1 - sa * 3, p.y - sa * 1 + ca * 3, p.x - ca * 1 + sa * 3, p.y - sa * 1 - ca * 3);
    stroke(200, 80, 60); strokeWeight(2); line(bx, by, bx - ca * 3 - sa * 2, by - sa * 3 + ca * 2);
    noStroke();
  } else if (p.kind === 'frost') {
    stroke(140, 225, 255, 110); strokeWeight(4); line(p.x - p.vx * 0.04, p.y - p.vy * 0.04, p.x, p.y);
    noStroke(); fill(150, 230, 255, 90); ellipse(p.x, p.y, 14, 14);
    fill(225, 250, 255); ellipse(p.x, p.y, 6, 6);
  } else if (p.kind === 'shell') {
    noStroke(); fill(0, 0, 0, 60); ellipse(p.x + 2, p.y + 5, 11, 5);
    fill(55, 50, 46); ellipse(p.x, p.y, 11, 11);
    fill(255, 175, 70); ellipse(p.x - 1, p.y - 1, 5, 5);
  } else {
    stroke(255, p.crit ? 170 : 225, p.crit ? 80 : 120, 150); strokeWeight(4); line(p.x - p.vx * 0.03, p.y - p.vy * 0.03, p.x, p.y);
    stroke(255, 250, 220); strokeWeight(2); line(p.x - p.vx * 0.014, p.y - p.vy * 0.014, p.x, p.y);
    noStroke();
  }
}

function drawFigure(x, y, r, pal, aim, phase, flash, wk, helm, type) {
  push(); translate(x, y);
  noStroke(); fill(0, 0, 0, 70); ellipse(0, r * 1.0, r * 2, r * 0.8);
  if (type === 'boss') { fill(140, 20, 30, 210); triangle(-r * 0.9, -r * 0.5, r * 0.9, -r * 0.5, 0, r * 1.3); }
  const sw = Math.sin(phase) * r * 0.5;
  stroke(pal.dark[0], pal.dark[1], pal.dark[2]); strokeWeight(r * 0.4);
  line(-r * 0.32, r * 0.3, -r * 0.32 + sw * 0.6, r * 0.98 - Math.abs(sw) * 0.15);
  line(r * 0.32, r * 0.3, r * 0.32 - sw * 0.6, r * 0.98 - Math.abs(sw) * 0.15);
  noStroke();
  let bc = pal.body;
  if (flash > 0) { const f = Math.min(1, flash); bc = [lerp(bc[0], 255, f), lerp(bc[1], 255, f), lerp(bc[2], 255, f)]; }
  fill(bc[0], bc[1], bc[2]); ellipse(0, -r * 0.1, r * 1.6, r * 1.8);
  fill(pal.dark[0], pal.dark[1], pal.dark[2], 170); rect(-r * 0.75, r * 0.12, r * 1.5, r * 0.22);
  if (type === 'tank') {
    fill(pal.gear[0], pal.gear[1], pal.gear[2]);
    ellipse(-r * 0.85, -r * 0.45, r * 0.8, r * 0.8); ellipse(r * 0.85, -r * 0.45, r * 0.8, r * 0.8);
  }
  // head + headgear
  fill(pal.skin[0], pal.skin[1], pal.skin[2]); ellipse(0, -r * 1.0, r * 0.95, r * 0.95);
  if (helm === 0) { fill(70, 45, 25); arc(0, -r * 1.05, r * 1.05, r * 1.05, Math.PI, TAU); }
  else if (helm === 1) {
    fill(pal.gear[0], pal.gear[1], pal.gear[2]); arc(0, -r * 1.02, r * 1.08, r * 1.08, Math.PI, TAU);
    rect(-r * 0.54, -r * 1.04, r * 1.08, r * 0.13); rect(-r * 0.05, -r * 1.04, r * 0.1, r * 0.4);
  } else if (helm === 2) {
    fill(pal.gear[0], pal.gear[1], pal.gear[2]); arc(0, -r * 1.05, r * 1.0, r * 1.0, Math.PI, TAU);
    rect(-r * 0.62, -r * 1.07, r * 1.24, r * 0.11);
  } else {
    fill(pal.gear[0], pal.gear[1], pal.gear[2]); arc(0, -r * 1.0, r * 1.1, r * 1.1, Math.PI, TAU);
    rect(-r * 0.55, -r * 1.0, r * 1.1, r * 0.3, 2);
    fill(120, 200, 255, 190); rect(-r * 0.4, -r * 0.98, r * 0.8, r * 0.2);
  }
  if (type === 'boss') {
    fill(235, 225, 205);
    triangle(-r * 0.38, -r * 1.35, -r * 0.7, -r * 2.05, -r * 0.08, -r * 1.35);
    triangle(r * 0.38, -r * 1.35, r * 0.7, -r * 2.05, r * 0.08, -r * 1.35);
    fill(255, 60, 40); ellipse(-r * 0.16, -r * 0.98, r * 0.16, r * 0.16); ellipse(r * 0.16, -r * 0.98, r * 0.16, r * 0.16);
  }
  // weapon
  push(); translate(0, -r * 0.1); rotate(aim);
  if (wk === 'club') {
    stroke(110, 75, 40); strokeWeight(r * 0.3); line(r * 0.4, 0, r * 1.7, 0);
    noStroke(); fill(90, 60, 30); ellipse(r * 1.8, 0, r * 0.75, r * 0.75);
  } else if (wk === 'sword') {
    stroke(215, 220, 230); strokeWeight(r * 0.2); line(r * 0.4, 0, r * 1.9, 0);
    stroke(160, 125, 50); line(r * 0.55, -r * 0.35, r * 0.55, r * 0.35);
  } else if (wk === 'bow') {
    noFill(); stroke(130, 90, 50); strokeWeight(r * 0.22); arc(r * 0.6, 0, r * 0.8, r * 2.0, -Math.PI / 2, Math.PI / 2);
    stroke(235, 235, 235); strokeWeight(1); line(r * 0.6, -r, r * 0.6, r);
  } else if (wk === 'musket') {
    stroke(95, 68, 42); strokeWeight(r * 0.3); line(0, 0, r * 0.9, 0);
    stroke(75, 75, 80); strokeWeight(r * 0.2); line(r * 0.8, 0, r * 2.1, 0);
  } else if (wk === 'rifle') {
    stroke(60, 60, 52); strokeWeight(r * 0.26); line(0, 0, r * 2.1, 0);
    stroke(95, 68, 42); strokeWeight(r * 0.3); line(0, 0, r * 0.7, 0);
  } else {
    stroke(40, 42, 46); strokeWeight(r * 0.36); line(0, 0, r * 2.0, 0);
    stroke(255, 80, 60); strokeWeight(r * 0.14); point(r * 0.9, -r * 0.25);
  }
  noStroke(); pop();
  if (type === 'tank') {
    push(); translate(0, -r * 0.1); rotate(aim);
    fill(pal.gear[0], pal.gear[1], pal.gear[2]); stroke(pal.dark[0], pal.dark[1], pal.dark[2]); strokeWeight(1.5);
    rect(r * 0.95, -r * 0.85, r * 0.38, r * 1.7, 3);
    noStroke(); pop();
  }
  pop();
}

function drawBar(x, y, w, frac, col) {
  noStroke(); fill(0, 0, 0, 150); rect(x - w / 2 - 1, y - 1, w + 2, 5, 2);
  fill(col[0], col[1], col[2]); rect(x - w / 2, y, w * constrain(frac, 0, 1), 3, 2);
}

function drawFlyer(e) {
  const r = e.r;
  push(); translate(e.x, e.y);
  noStroke(); fill(0, 0, 0, 55); ellipse(0, r * 1.1, r * 1.8, r * 0.6);
  const f = Math.sin(time * 18 + e.seed) * 0.5 + 0.5;
  translate(0, -r * 0.9);
  fill(150, 55, 85, 235);
  triangle(-r * 0.3, 0, -r * 2.1, -r * (0.3 + f * 1.0), -r * 1.4, r * 0.6);
  triangle(r * 0.3, 0, r * 2.1, -r * (0.3 + f * 1.0), r * 1.4, r * 0.6);
  const fl = Math.min(1, e.flash);
  fill(lerp(75, 255, fl), lerp(30, 255, fl), lerp(55, 255, fl)); ellipse(0, 0, r * 1.3, r * 1.7);
  fill(255, 220, 120); ellipse(-r * 0.22, -r * 0.35, r * 0.25, r * 0.25); ellipse(r * 0.22, -r * 0.35, r * 0.25, r * 0.25);
  pop();
}

function drawEnemy(e) {
  if (e.type === 'flyer') drawFlyer(e);
  else {
    const pal = SPECIAL_PAL[e.type] || EPAL[e.era];
    const wk = e.type === 'gunner' ? 'musket' : ENEMY_WEAPON[e.era];
    const helm = (e.type === 'armored' || e.type === 'shielded') ? 3 : e.era;
    const fig = (e.type === 'brute' || e.type === 'splitter') ? 'tank' : e.type;
    drawFigure(e.x, e.y, e.r, pal, e.aim, e.phase, e.flash, wk, helm, fig);
    if (e.shield > 0) {
      noFill(); stroke(120, 200, 255, 70 + 120 * (e.shield / e.maxShield)); strokeWeight(2);
      ellipse(e.x, e.y - e.r * 0.3, e.r * 3.1, e.r * 3.4); noStroke();
    }
  }
  if (e.hp < e.maxHp || e.type === 'boss' || e.shield > 0) {
    const w = e.type === 'boss' ? 56 : e.r * 2.6;
    const f = e.hp / e.maxHp;
    const yb = e.y - e.r * (e.type === 'boss' ? 2.5 : (e.type === 'flyer' ? 2.8 : 1.8)) - 5;
    drawBar(e.x, yb, w, f, f > 0.5 ? [90, 220, 90] : (f > 0.25 ? [235, 200, 60] : [235, 70, 60]));
    if (e.shield > 0) drawBar(e.x, yb - 5, w, e.shield / e.maxShield, [120, 200, 255]);
  }
}

function drawTower(t) {
  const c = t.def.color;
  push(); translate(t.x, t.y);
  noStroke(); fill(0, 0, 0, 65); ellipse(0, 10, 34, 13);
  fill(65, 68, 62); rect(-13, 0, 26, 9, 3); fill(c[0], c[1], c[2]); rect(-11, -8, 22, 14, 4);
  fill(35, 40, 42); push(); translate(0, -5); rotate(t.angle); rect(0, -3, 19 + t.lv * 2, 6 + t.lv * 0.8, 2); fill(c[0], c[1], c[2]); ellipse(3, 0, 8, 8); pop();
  if (t.type === 'sniper') { stroke(220, 235, 255); strokeWeight(2); line(-5, -9, 5, -9); noStroke(); }
  if (t.type === 'frost') { fill(210, 250, 255); ellipse(0, -6, 7, 7); }
  if (t.flash > 0) { fill(c[0], c[1], c[2], 100 * t.flash); ellipse(0, -5, 26 + 12 * t.flash, 26 + 12 * t.flash); }
  // level pips
  for (let i = 0; i < t.lv; i++) { fill(255, 225, 100); stroke(90, 60, 10); strokeWeight(1); ellipse(-12 + i * 4, -16, 3.6, 3.6); }
  noStroke();
  pop();
}
function drawPickedRing(t) {
  const st = tStats(t);
  noFill(); stroke(255, 255, 255, 90); strokeWeight(1.5); ellipse(t.x, t.y, st.range * 2, st.range * 2);
  stroke(140, 255, 170, 220); strokeWeight(2); ellipse(t.x, t.y, 38 + Math.sin(time * 6) * 2, 38 + Math.sin(time * 6) * 2);
  noStroke();
}
function drawPlacementGhost(x, y) {
  const d = TOWERS[selectedTower];
  noFill(); stroke(220, 255, 220, 100); strokeWeight(1.5); ellipse(x, y, d.range * 2, d.range * 2);
  stroke(130, 255, 160, 180); fill(d.color[0], d.color[1], d.color[2], 95); ellipse(x, y, 28, 28); noStroke();
  textSize(12); fill(255); text('Tap to place', x, y - 25);
}

function drawSoldier(s) {
  if (rallyT > 0) {
    noFill(); stroke(255, 225, 100, 120 + 80 * Math.sin(time * 8)); strokeWeight(2);
    ellipse(s.x, s.y + s.r, s.r * 3, s.r * 1.2); noStroke();
  }
  drawFigure(s.x, s.y, s.r, APAL, s.aim, s.phase, s.hurt * 4, s.def.wk, s.def.helm, 'ally');
  if (s.hp < s.maxHp) drawBar(s.x, s.y - s.r * 1.9 - 4, 18, s.hp / s.maxHp, [80, 190, 240]);
}

function drawWeaponArt(lv, pull) {
  push(); translate(-pull * 6, 0); noFill(); strokeCap(ROUND);
  if (lv === 0) {
    stroke(125, 85, 45); strokeWeight(4); arc(6, 0, 24, 42, -Math.PI / 2, Math.PI / 2);
    stroke(240); strokeWeight(1.2); line(6, -21, 2 - pull * 5, 0); line(2 - pull * 5, 0, 6, 21);
    if (pull < 0.6) { stroke(210, 190, 140); strokeWeight(2); line(2, 0, 30, 0); stroke(220); strokeWeight(3); line(30, 0, 33, 0); }
  } else if (lv === 1) {
    stroke(105, 72, 42); strokeWeight(6); line(-8, 0, 30, 0);
    stroke(62, 62, 68); strokeWeight(4); line(22, -17, 27, 0); line(27, 0, 22, 17);
    stroke(235); strokeWeight(1.3); line(22, -17, 8 - pull * 3, 0); line(8 - pull * 3, 0, 22, 17);
    if (pull < 0.6) { stroke(210); strokeWeight(2); line(8, 0, 34, 0); }
  } else if (lv === 2) {
    stroke(100, 70, 42); strokeWeight(8); line(-10, 2, 14, 2);
    stroke(80, 80, 86); strokeWeight(4.5); line(8, 0, 46, 0);
    stroke(150, 130, 70); strokeWeight(3); line(20, 0, 22, 0); line(34, 0, 36, 0);
  } else if (lv === 3) {
    stroke(100, 70, 42); strokeWeight(8); line(-12, 2, 14, 2);
    stroke(55, 58, 62); strokeWeight(4.5); line(10, 0, 52, 0);
    noStroke(); fill(35, 38, 42); rect(16, -8, 16, 4, 2); fill(120, 190, 255); rect(30, -8, 2, 4);
    fill(60, 64, 68); rect(14, 3, 6, 9, 1); noFill();
  } else {
    noStroke(); fill(45, 48, 54); rect(-8, -6, 40, 12, 3);
    fill(30, 32, 36); rect(30, -3, 26, 6, 2); rect(54, -5, 4, 10);
    fill(60, 64, 70); rect(8, 5, 7, 14, 2);
    fill(255, 80, 60); ellipse(14, -8, 4, 4); fill(120, 130, 140); rect(-16, -2, 9, 5, 2); noFill();
  }
  pop();
}

function drawBunker() {
  const x = bunker.x, y = bunker.y, lv = weapon.lv;
  push(); translate(x, y);
  noStroke(); fill(0, 0, 0, 85); ellipse(0, 26, 132, 22);
  const fw = Math.sin(time * 4) * 4, fc = FLAG[lv];
  stroke(70, 60, 50); strokeWeight(2); line(-34, -6, -34, -48);
  noStroke(); fill(fc[0], fc[1], fc[2]); triangle(-34, -48, -34, -33, -9 + fw, -40);
  fill(120, 118, 108); rect(-38, -4, 76, 28, 4);
  fill(162, 160, 148); rect(-38, -10, 76, 9, 4);
  fill(35, 35, 32); rect(-24, 6, 48, 7, 2);
  if (lv >= 2) { fill(96, 101, 110); rect(-38, -4, 12, 28, 3); rect(26, -4, 12, 28, 3); }
  if (lv >= 3) { stroke(85); strokeWeight(2); line(30, -10, 30, -32); noStroke(); fill(80, 220, 120); ellipse(30, -33, 5, 5); }
  for (let i = -3; i <= 3; i++) { if (Math.abs(i) < 2) continue; fill(184, 158, 108); rect(i * 14 - 7, 8, 15, 8, 4); }
  for (let i = -4; i <= 4; i++) { fill(172, 146, 98); rect(i * 14 - 8, 16, 16, 9, 4); fill(190, 165, 115, 120); rect(i * 14 - 6, 17, 10, 3, 2); }
  if (bunker.hp / bunker.maxHp < 0.5) { stroke(40, 40, 36, 190); strokeWeight(1.5); line(-22, -8, -15, 5); line(-15, 5, -21, 15); line(14, -8, 19, 3); noStroke(); }
  if (bunker.flash > 0) { fill(255, 70, 60, bunker.flash * 220); rect(-38, -10, 76, 34, 4); }
  noStroke(); fill(70, 75, 82); ellipse(0, PIV, 30, 30); fill(104, 110, 120); ellipse(0, PIV - 1, 21, 21);
  push(); translate(0, PIV); rotate(bunker.angle); drawWeaponArt(lv, weapon.recoil); pop();
  noStroke(); fill(55, 60, 66); ellipse(0, PIV, 10, 10);
  pop();
}

function drawBanner() {
  const p = banner.t / banner.dur;
  const a = p < 0.15 ? p / 0.15 : (p > 0.75 ? (1 - p) / 0.25 : 1);
  const y = height * 0.3;
  textStyle(BOLD); textSize(Math.min(44, width * 0.1));
  fill(0, 0, 0, 150 * a); text(banner.txt, width / 2 + 2, y + 2);
  fill(255, 235, 130, 255 * a); text(banner.txt, width / 2, y);
  if (banner.sub) { textSize(16); fill(255, 255, 255, 230 * a); text(banner.sub, width / 2, y + 34); }
  textStyle(NORMAL);
}

function drawEndOverlay() {
  const won = state === 'won';
  noStroke(); fill(0, 0, 0, 175); rect(0, 0, width, height);
  textStyle(BOLD); textSize(Math.min(34, width * 0.08));
  if (won) fill(255, 235, 90); else fill(225, 70, 70);
  text(won ? 'VICTORY - BUNKER STANDS!' : 'BUNKER DESTROYED', width / 2, height / 2 - 40);
  textStyle(NORMAL); textSize(16); fill(230);
  text(won ? 'All ' + MAX_WAVE + ' waves cleared  -  Kills ' + kills : 'Waves cleared ' + (wave - 1) + '  -  Kills ' + kills, width / 2, height / 2);
  fill(255, 224, 96); text('Best: wave ' + bestWave + (daily ? '  (daily)' : ''), width / 2, height / 2 + 26);
  fill(185); textSize(13); text('Tap anywhere to play again', width / 2, height / 2 + 56);
}

/* ---------------- HUD / BUTTONS ---------------- */
function setTxt(id, v) {
  if (hudCache[id] !== v) { hudCache[id] = v; document.getElementById(id).textContent = v; }
}
function setText(el, v) { if (el._v !== v) { el._v = v; el.textContent = v; } }
function setOn(el, on) { if (el._on !== on) { el._on = on; el.classList.toggle('on', on); } }
function updateHUD() {
  const pct = Math.max(0, bunker.hp / bunker.maxHp * 100);
  setTxt('hpTxt', Math.ceil(bunker.hp) + ' / ' + bunker.maxHp);
  UI.hpFill.style.width = pct + '%';
  UI.hpFill.style.background = 'hsl(' + Math.round(pct * 1.2) + ',72%,48%)';
  setTxt('cred', credits);
  setTxt('wave', Math.min(wave, MAX_WAVE));
  setTxt('waveMax', ' / ' + MAX_WAVE);
  setTxt('info1', waveActive ? 'Foes left: ' + (enemies.length + queue.length) : (state === 'play' ? 'Next: ' + waveInfo() : ''));
  setTxt('info2', 'Soldiers ' + soldiers.length + '/' + MAX_SOLDIERS + '  Towers ' + towers.length + '/' + MAX_TOWERS + '  Kills ' + kills + '  Best ' + bestWave);
}

function setBtn(el, title, sub, disabled, cls, base) {
  const html = '<span class="t">' + title + '</span><span class="s">' + sub + '</span>';
  if (el._h !== html) { el.innerHTML = html; el._h = html; }
  if (el.disabled !== disabled) el.disabled = disabled;
  const c = (base || 'btn') + (cls ? ' ' + cls : '');
  if (el._c !== c) { el.className = c; el._c = c; }
}
function updateButtons() {
  const playing = state === 'play', nxt = WEAPONS[weapon.lv + 1];
  setBtn(UI.up, 'Upgrade', nxt ? nxt.name + ' - $' + nxt.cost : 'MAX - ' + WEAPONS[weapon.lv].name, !playing || !nxt || credits < nxt.cost);
  const sd = SOLDIERS[weapon.lv];
  setBtn(UI.dep, 'Deploy', sd.name + ' - $' + sd.cost + ' (' + soldiers.length + '/' + MAX_SOLDIERS + ')', !playing || credits < sd.cost || soldiers.length >= MAX_SOLDIERS);
  setBtn(UI.rep, 'Repair', '$' + REPAIR_COST + ' - +' + Math.round(bunker.maxHp * 0.35) + ' HP', !playing || credits < REPAIR_COST || bunker.hp >= bunker.maxHp - 0.5);
  if (!playing) setBtn(UI.start, 'PLAY AGAIN', 'start over', false, 'go');
  else if (waveActive) setBtn(UI.start, 'FIGHTING', (enemies.length + queue.length) + ' left', true, 'go');
  else setBtn(UI.start, 'START WAVE ' + wave, waveInfo(), false, 'go');
}

function updateExtraUI() {
  const playing = state === 'play';
  // abilities
  const ab = [[UI.air, 'air', waveActive && enemies.length > 0], [UI.freeze, 'freeze', waveActive && enemies.length > 0], [UI.rally, 'rally', soldiers.length > 0]];
  for (const [el, k, usable] of ab) {
    const cd = abil[k].cd;
    setBtn(el, ABIL_DEF[k].name, cd > 0 ? Math.ceil(cd) + 's' : (usable ? 'READY' : (k === 'rally' ? 'need soldiers' : 'in wave')), !playing || cd > 0 || !usable, '', 'abil');
  }
  setBtn(UI.perks, 'Perks', perkOpen ? 'close' : 'bunker', !playing, 'perk', 'abil');
  // toggles
  setText(UI.sound, muted ? 'Mute' : 'Snd'); setOn(UI.sound, !muted);
  setOn(UI.auto, autoWave);
  setText(UI.diff, daily ? 'Norm' : DIFFS[diffKey].label); setOn(UI.diff, !daily && diffKey !== 'normal');
  setOn(UI.daily, daily);
  // tower panel
  if (pickedTower && towers.indexOf(pickedTower) < 0) pickedTower = null;
  const showT = !!pickedTower && playing, showP = perkOpen && playing && !selectedTower;
  if (UI.tp._show !== showT) { UI.tp._show = showT; UI.tp.classList.toggle('show', showT); }
  if (UI.pp._show !== showP) { UI.pp._show = showP; UI.pp.classList.toggle('show', showP); }
  if (showT) {
    const t = pickedTower, st = tStats(t), maxed = t.lv >= TOWER_MAX_LV, c = towerUpCost(t);
    setText(UI.tpTitle, t.def.name + ' Lv ' + (t.lv + 1) + '/' + (TOWER_MAX_LV + 1) + '  -  dmg ' + Math.round(st.dmg) + '  range ' + Math.round(st.range) + '  rate ' + (1 / st.cd).toFixed(1) + '/s');
    setBtn(UI.tpUp, maxed ? 'Maxed' : 'Upgrade', maxed ? 'Lv ' + (TOWER_MAX_LV + 1) + '/' + (TOWER_MAX_LV + 1) : 'to Lv ' + (t.lv + 2) + ' - $' + c, maxed || credits < c);
    setBtn(UI.tpSell, 'Sell', '+$' + towerSellValue(t), false);
    setBtn(UI.tpTgt, 'Target', TARGET_NAMES[t.mode], false);
  }
  if (showP) {
    for (const k in PERKS) {
      const P = PERKS[k], lv = perks[k], maxed = lv >= P.max, c = perkCost(k);
      setBtn(UI.pk[k], P.name + ' ' + lv + '/' + P.max, maxed ? 'MAX' : '$' + c + ' - ' + P.txt, maxed || credits < c);
    }
  }
}

/* ---------------- MAIN LOOP ---------------- */
function draw() {
  const rawDt = Math.min(deltaTime / 1000, 0.05);
  time += rawDt;
  const dt = (paused || state !== 'play') ? 0 : rawDt * speedMul;
  if (dt > 0) {
    const n = Math.min(6, Math.ceil(dt / 0.025));          // substeps keep 2x/3x speed accurate
    for (let i = 0; i < n; i++) { update(dt / n); if (state !== 'play') break; }
  }
  render();
  updateHUD();
  updateButtons(); updateTowerShop(); updateExtraUI();
  if (UI.btns.offsetHeight !== lastBtnH) layout();
}
</script>
</body>
